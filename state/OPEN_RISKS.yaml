schema_version: "1.0.0"
phase: P01
risks:
  - id: P00-RISK-001
    severity: medium
    status: open
    title: NautilusTrader upstream maturity is Beta
    containment: Restrict use to deterministic replay contract; no trading adapters are registered.
  - id: P00-RISK-002
    severity: medium
    status: open
    title: Windows client support is not an explicit upstream production guarantee
    containment: Treat local import and replay as a P00-only contract and retain WSL as a future option.
  - id: P00-RISK-003
    severity: low
    status: open
    title: Docker and NVIDIA CUDA tooling are absent on the host
    containment: P00 does not require containers or GPU; record capability without claiming availability.
  - id: P00-RISK-004
    severity: low
    status: open
    title: User data paths and optional provider permissions are not provided
    containment: Keep every provider denied and defer path access until explicit future authorization.
  - id: P00-RISK-005
    severity: low
    status: open
    title: Nautilus replay emits a pandas Timestamp.utcnow deprecation warning
    containment: Keep the deterministic contract and monitor upstream before any dependency upgrade.
  - id: P00-RISK-006
    severity: low
    status: open
    title: GitHub Actions has not executed on a remote repository
    containment: Pin every action to a commit SHA and retain the passing complete local CI as P00 evidence.
  - id: P00-RISK-007
    severity: low
    status: open
    title: uv minor-version junction creation returned exit 2 during runtime bootstrap
    containment: Use exact interpreter paths and require both runtime contracts to pass.
  - id: P01-RISK-001
    severity: medium
    status: open
    title: EDB Windows ZIP has no independently observed upstream signature or checksum list
    containment: Download only from the HTTPS URL linked by the official PostgreSQL page, pin the observed SHA-256, and prohibit production use.
  - id: P01-RISK-002
    severity: medium
    status: open
    title: Disposable loopback PostgreSQL contract clusters use trust authentication
    containment: Bind only to a random loopback port in a temporary directory; never register a service, expose the port, or reuse the data directory.
  - id: P01-RISK-003
    severity: medium
    status: open
    title: Domain, accounting, risk, and order artifacts are contracts rather than complete engines
    containment: Require later state-machine, reconciliation, risk, recovery, and failure tests before claiming those capabilities.
  - id: P01-RISK-004
    severity: low
    status: open
    title: Host Node.js 24.12.0 differs from the locked 24.20.0 baseline
    containment: Prepend the ignored pinned 24.20.0 runtime for local CI and keep remote CI fixed to the same version.
