schema_version: "1.0.0"
phase: "V5-P12"
evidence_tier: "DEVELOPMENT"
risks:
  - risk_id: "V5-RISK-001"
    status: "open"
    severity: "high"
    summary: "v4.0/v4.1 source plans are absent from the workspace and Git history"
    disposition: "Record SOURCE_ABSENT; never fabricate archived plans"
  - risk_id: "V5-RISK-002"
    status: "mitigated"
    severity: "critical"
    summary: "legacy fixture and synthetic results were not universally tiered"
    disposition: "V5-P00 classified and hash-bound all 482 legacy reports; promotion eligible count is zero"
  - risk_id: "V5-RISK-003"
    status: "mitigated"
    severity: "critical"
    summary: "legacy fixed HORIZON_SCALE is not a learned event Alpha model"
    disposition: "V5-P08 removed fixed production constants; legacy fixtures require explicit coefficients and remain non-promotable"
  - risk_id: "V5-RISK-004"
    status: "open"
    severity: "high"
    summary: "no real v5 OOS, Paper, Shadow, or Testnet forward evidence exists"
    disposition: "Preserve NO_PROVEN_ALPHA and do not lower gates"
  - risk_id: "V5-RISK-005"
    status: "mitigated"
    severity: "critical"
    summary: "P01 implements truth contracts but has no calibrated or real-world truth model"
    disposition: "P04 implemented a development-only calibrated council; real-world accuracy remains open under V5-RISK-008"
  - risk_id: "V5-RISK-006"
    status: "open"
    severity: "high"
    summary: "P02 C2PA evidence uses a self-generated development trust root and has no production trust-list or revocation operations"
    disposition: "Keep evidence DEVELOPMENT, disable implicit network fetches, and require a later controlled trust-policy phase before production use"
  - risk_id: "V5-RISK-007"
    status: "open"
    severity: "high"
    summary: "P03 dependency detection has deterministic provenance fixtures but no labelled real-world retrieval benchmark"
    disposition: "Keep DEVELOPMENT and uncalibrated; require measured precision/recall before semantic similarity or truth promotion"
  - risk_id: "V5-RISK-008"
    status: "open"
    severity: "critical"
    summary: "P04 calibration metrics use a small deterministic development fixture and do not estimate real-world truth accuracy"
    disposition: "Keep NO_PROMOTION; require PIT-labelled public claims, independent OOS evaluation, drift monitoring, and forward validation"
  - risk_id: "V5-RISK-009"
    status: "open"
    severity: "medium"
    summary: "Historical V5 manifest anchors are mutable worktree self-consistency checks, not externally protected attestations"
    disposition: "Do not claim immutable history; add a protected remote, signature, or transparency log before production governance"
  - risk_id: "V5-RISK-010"
    status: "open"
    severity: "medium"
    summary: "P04 derived-signal lineage hashes are content-addressed references without a protected artifact-registry existence proof"
    disposition: "Keep DEVELOPMENT; require registry resolution and immutable storage before production truth scoring"
  - risk_id: "V5-RISK-011"
    status: "open"
    severity: "critical"
    summary: "P05 MarketReflectionScore is a deterministic weighted heuristic, not a calibrated price-in probability"
    disposition: "Keep the 0.80 threshold versioned and DEVELOPMENT-only; require real PIT event/market labels and OOS calibration before relying on its magnitude"
  - risk_id: "V5-RISK-012"
    status: "mitigated"
    severity: "critical"
    summary: "P05 does not identify causal event effects or prove event-driven forecast accuracy"
    disposition: "V5-P06 implemented leakage-safe causal contracts and diagnostics; real causal effectiveness remains covered by V5-RISK-004"
  - risk_id: "V5-RISK-013"
    status: "open"
    severity: "high"
    summary: "P08/P09 content hashes do not prove external split, permutation, prediction, or monitoring artifact authenticity"
    disposition: "Keep DEVELOPMENT; require protected artifact registry resolution, signatures, and replay before production governance"
  - risk_id: "V5-RISK-014"
    status: "mitigated"
    severity: "critical"
    summary: "P09 forecast governance is not yet a mandatory execution authorization input"
    disposition: "V5-P10 content-binds Forecast, Truth, Price-In, Cost, Portfolio, and Independent Risk; every rejection becomes a first-class NO_TRADE"
  - risk_id: "V5-RISK-015"
    status: "open"
    severity: "critical"
    summary: "P09 adaptive conformal and dynamic stacking have deterministic fixtures but no real OOS or forward validity evidence"
    disposition: "Preserve NO_PROVEN_ALPHA; measure rolling per-cell coverage, weight stability, and baseline lift on real PIT data"
  - risk_id: "V5-RISK-016"
    status: "open"
    severity: "critical"
    summary: "P10 ExecutionCostModelV2 and TCA confidence use deterministic DEVELOPMENT fixtures"
    disposition: "Require continuous predicted-vs-realized cost evidence in V5-P11 and reduce Net Edge confidence whenever cost calibration degrades"
  - risk_id: "V5-RISK-017"
    status: "open"
    severity: "high"
    summary: "P10 discrete forecast and cost scenarios do not establish the real joint return-cost distribution"
    disposition: "Estimate aligned scenario distributions from PIT OOS and Forward samples; retain NO_PROVEN_ALPHA until distributional checks pass"
  - risk_id: "V5-RISK-018"
    status: "open"
    severity: "high"
    summary: "Bootstrap Net Edge thresholds may be mistaken for permanent Alpha parameters"
    disposition: "Keep thresholds explicit and versioned per asset x horizon x sleeve; OOS-selected thresholds require a content-addressed evidence artifact"
  - risk_id: "V5-RISK-019"
    status: "mitigated"
    severity: "critical"
    summary: "A medium-truth severe event could be misused as directional Alpha"
    disposition: "V5-P10 separates EventRiskOverlay from EventDirectionalAlpha and requires a REDUCE_ONLY or HALTED independent risk decision for overlays"
  - risk_id: "V5-RISK-020"
    status: "open"
    severity: "high"
    summary: "P10 structurally revalidates RiskDecision but does not carry a cryptographic risk-service attestation receipt"
    disposition: "P12 execution readiness must bind the signed policy, exact risk snapshot, alerts, and immutable authorization receipt before Testnet or Canary review"
  - risk_id: "V5-RISK-021"
    status: "open"
    severity: "high"
    summary: "P11 wall-clock, external data, incident, and recovery claims lack protected timestamp or transparency-log attestation"
    disposition: "Keep DEVELOPMENT and zero observed real days; require signed receipts and external alert evidence in P12"
  - risk_id: "V5-RISK-022"
    status: "open"
    severity: "high"
    summary: "P11 independent-event sample threshold has no real-world power study"
    disposition: "Precommit the threshold and rationale; extend Paper when samples are insufficient and never lower the gate after observation"
  - risk_id: "V5-RISK-023"
    status: "open"
    severity: "critical"
    summary: "No real Binance Testnet run, reconciliation, or external alert-delivery evidence exists"
    disposition: "Keep all P12 gates blocked; never substitute the simulator or loopback receiver for external evidence"
  - risk_id: "V5-RISK-024"
    status: "open"
    severity: "high"
    summary: "The production attestor identity, key custody, rotation, revocation, and transparency log are not established"
    disposition: "Use the key only for DEVELOPMENT contract tests; require an independently approved protected trust root before any real run"
  - risk_id: "V5-RISK-025"
    status: "open"
    severity: "high"
    summary: "The Testnet soak, order, and fill thresholds are DEVELOPMENT bootstrap values without a production power study"
    disposition: "Complete and precommit the power and capacity study before observation; never lower thresholds after seeing results"
  - risk_id: "V5-RISK-026"
    status: "open"
    severity: "critical"
    summary: "The local seven-gate P12 contract could be mistaken for a completed global Promotion Gate"
    disposition: "Record the global gate as not evaluated; incomplete Data, Economics, Statistics, and Forward dimensions force NO_PROMOTION"
