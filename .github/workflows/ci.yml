name: V5-P12 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Python runtimes and dependencies
        run: |
          uv python install 3.13.15 3.14.7
          uv sync --all-groups --frozen --python 3.13.15
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Install pnpm and web dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium firefox webkit
      - name: Run complete V5-P12 verification
        run: uv run --frozen python scripts/ci.py --phase V5-P12
