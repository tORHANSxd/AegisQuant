schema_version: p18-continuous-operations-v1
active_live_schedule: false
paper_shadow_schedule_available: true
cadence:
- frequency: DAILY
  checks:
  - 数据质量与缺口
  - 账户订单成交仓位与账本对账
  - PnL费用资金费率与滑点
  - 风险状态与事故
  - 模型新鲜度与漂移
  - 交易所公告与规则变化
  - 备份状态
- frequency: WEEKLY
  checks:
  - 策略模型实际与预期偏差
  - 执行质量
  - 风险预算
  - 数据源健康
  - 失败实验与新假设
  - 依赖与安全变更
  - 容量与成本曲线
- frequency: MONTHLY
  checks:
  - 组合归因
  - 模型校准
  - 策略相关与重复
  - 参数与状态稳定
  - 压力测试
  - 事故复盘
  - 数据与云成本
  - 恢复演练抽查
- frequency: QUARTERLY
  checks:
  - 全依赖升级评估
  - 交易所 API 契约回归
  - 权限与密钥轮换
  - Provider 采购复审
  - 模型策略再验证
  - 威胁模型更新
  - 灾备恢复演练
  - Live 资本上限重新批准
