    license_status: "approved"
    credentials_required: false
    regions_or_account_constraints: []
    rate_limits: {}
    latency_expectation_ms: null
    revision_policy: "pinned_commit"
    supported_datasets:
      - "alltypes_plain_parquet"
    time_semantics_documented: true
    retention_policy: "Retain provenance and hash; process the public sample in memory"
    quality_score: null
    incremental_value_score: null
    status: "approved"
    owner: "user"
    source_policy_id: "apache_parquet_testing_v1"
  - provider_id: "user_local_assets"
    provider_name: "User-authorized local assets"
    provider_type: "local"
    access_method: "file"
    authority_level: "primary"
    license_status: "unknown"
    credentials_required: false
    regions_or_account_constraints:
      - "explicit_read_only_path_authorization_required"
