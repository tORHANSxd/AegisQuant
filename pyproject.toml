[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "aegisquant"
version = "3.1.0.dev0"
description = "AegisQuant safety-locked multimodal event intelligence domain core"
readme = "README.md"
requires-python = ">=3.13.15,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "AegisQuant" }]
dependencies = [
  "alembic==1.19.1",
  "cryptography==50.0.1",
  "duckdb==1.5.5",
  "jsonschema==4.26.0",
  "polars==1.44.1",
  "psycopg[binary]==3.3.4",
  "psutil==7.2.2",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.52",
]

[project.scripts]
aegisquant-data = "aegisquant.data.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.167.1",
  "pyarrow-stubs==20.0.0.20260819",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]
event-engine = [
  "nautilus-trader==1.231.0",
]
security = [
  "bandit==1.9.4",
  "cyclonedx-bom==7.3.1",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pre-commit==4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegisquant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest_tmp -ra"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "candidate_python: compatibility contract executed under candidate Python",
  "postgres: contract requiring a disposable PostgreSQL server",
  "nautilus: deterministic NautilusTrader contract",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs/spec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
  "COM812",
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"src/aegisquant/data/pit.py" = ["S608"] # Identifiers are allow-list validated before SQL assembly.
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "scripts", "tests"]
exclude = [
  "docs/spec",
  "tests/contract/test_nautilus_replay.py",
  "tests/contract/test_source_policy.py",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".tools"]
skips = []
