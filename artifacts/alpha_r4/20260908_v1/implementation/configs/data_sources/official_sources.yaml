schema_version: "1.0.0"
collection_default: "disabled"
cloud_inference_default: "prohibited"
foundation_model_training: "prohibited"
official_directory:
  exchanges:
    - {name: "OKX", url: "https://www.okx.com/help/section/announcements-latest-announcements"}
    - {name: "Bybit", url: "https://announcements.bybit.com/"}
    - {name: "Deribit", url: "https://insights.deribit.com/exchange-updates/"}
  stablecoins:
    - {name: "Tether", url: "https://tether.to/en/transparency/"}
    - {name: "Circle", url: "https://www.circle.com/transparency"}
  protocols:
    - {name: "Bitcoin Core", url: "https://bitcoincore.org/en/releases/"}
    - {name: "Ethereum", url: "https://blog.ethereum.org/"}
  regulators:
    - {name: "US SEC", url: "https://www.sec.gov/newsroom/press-releases"}
    - {name: "CFTC", url: "https://www.cftc.gov/PressRoom/PressReleases"}
  central_banks:
    - {name: "Federal Reserve", url: "https://www.federalreserve.gov/newsevents.htm"}
    - {name: "ECB", url: "https://www.ecb.europa.eu/press/html/index.en.html"}
  asset_managers:
    - {name: "BlackRock", url: "https://www.blackrock.com/corporate/newsroom"}
  infrastructure:
    - {name: "GitHub Status", url: "https://www.githubstatus.com/"}
sources:
  - source: "rss_atom"
    provider_id: "official_rss_atom"
    official_docs: "https://www.rfc-editor.org/rfc/rfc4287"
    access_state: "ready"
    credentials_required: false
    collection_enabled: false
    raw_storage: "public_append_only"
    display: "derived_only"
  - source: "gdelt"
    provider_id: "gdelt_public"
    official_docs: "https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/"
    access_state: "ready"
    credentials_required: false
    collection_enabled: false
    raw_storage: "metadata_only"
    display: "derived_only"
  - source: "x"
    provider_id: "x_official"
    official_docs: "https://docs.x.com/x-api/posts/filtered-stream/introduction"
    access_state: "awaiting_credentials"
    credentials_required: true
    collection_enabled: false
    quota_policy: "pay-per-usage; resolve current endpoint price and cap in the X developer console before enabling"
    raw_storage: "prohibited"
    display: "none"
  - source: "telegram_bot"
    provider_id: "telegram_bot"
    official_docs: "https://core.telegram.org/bots/api"
    access_state: "awaiting_credentials"
    credentials_required: true
    collection_enabled: false
    allowed_channels: []
    mtproto_enabled: false
    raw_storage: "prohibited"
    display: "none"
  - source: "bluesky_jetstream"
    provider_id: "bluesky_jetstream"
    official_docs: "https://github.com/bluesky-social/jetstream"
    access_state: "ready"
    credentials_required: false
    collection_enabled: false
    version_detection_required: true
    firehose_fallback_required: true
    raw_storage: "metadata_only"
    display: "derived_only"
  - source: "github"
    provider_id: "github_public"
    official_docs: "https://docs.github.com/en/rest/releases/releases"
    access_state: "ready"
    credentials_required: false
    collection_enabled: false
    raw_storage: "metadata_only"
    display: "derived_only"
  - source: "youtube"
    provider_id: "youtube_official"
    official_docs: "https://developers.google.com/youtube/v3/getting-started"
    access_state: "awaiting_credentials"
    credentials_required: true
    collection_enabled: false
    raw_storage: "prohibited"
    display: "none"
disabled_sources:
  - "reddit"
  - "discord"
  - "weibo"
  - "tiktok"
