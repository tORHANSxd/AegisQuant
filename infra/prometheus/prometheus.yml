global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: aegisquant

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aegisquant-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: read-api
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
