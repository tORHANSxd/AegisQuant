global:
  resolve_timeout: 5m

route:
  receiver: operator-standard
  group_by: [alertname, severity, scope]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m
  routes:
    - receiver: operator-critical
      matchers: ['severity=~"SEV0|SEV1"']
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 5m

inhibit_rules:
  - source_matchers: ['severity="SEV0"']
    target_matchers: ['severity=~"SEV1|SEV2|SEV3"']
    equal: [scope]
  - source_matchers: ['severity="SEV1"']
    target_matchers: ['severity=~"SEV2|SEV3"']
    equal: [scope]

receivers:
  - name: operator-critical
    webhook_configs:
      - url: __AEGISQUANT_OPERATOR_WEBHOOK__
        send_resolved: true
        max_alerts: 20
  - name: operator-standard
    webhook_configs:
      - url: __AEGISQUANT_OPERATOR_WEBHOOK__
        send_resolved: true
        max_alerts: 20
